name: Native module

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            extension: dylib
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            extension: dylib
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: so
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: so
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Verify native target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc +stable -vV | grep '^host: ' | cut -d ' ' -f 2)" = "$TARGET"
      - name: Test
        run: cargo +stable test --locked --manifest-path native/Cargo.toml --target ${{ matrix.target }}
      - name: Build release module
        run: cargo +stable build --locked --release --manifest-path native/Cargo.toml --target ${{ matrix.target }}
      - name: Package module and checksum
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          mkdir -p dist
          binary="lispm-auth-native-${PLATFORM}.${EXTENSION}"
          cp "native/target/${TARGET}/release/liblispm_auth_native.${EXTENSION}" "dist/${binary}"
          cd dist
          shasum -a 256 "$binary" > "${binary}.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lispm-auth-native-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
