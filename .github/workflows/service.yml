name: Standalone Common Lisp service

on:
  push:
    branches: [main, feature/standalone-auth-service]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x86_64
          - runner: ubuntu-22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ecl libsodium pkgconf texinfo
          echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"
          echo "SODIUM_PREFIX=$(brew --prefix libsodium)" >> "$GITHUB_ENV"
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ecl libecl-dev libgc-dev libgmp-dev libffi-dev libsodium-dev patchelf pkg-config build-essential libncurses-dev zlib1g-dev libgnutls28-dev texinfo
          mkdir -p build/sodium/lib build/sodium/include
          cp /usr/lib/x86_64-linux-gnu/libsodium.a build/sodium/lib/
          cp -R /usr/include/sodium /usr/include/sodium.h build/sodium/include/
          echo "SODIUM_PREFIX=$PWD/build/sodium" >> "$GITHUB_ENV"
      # Build the supported minimum with zlib. Headless CI does not need SVG.
      # Avoid moving Nixpkgs inputs which no longer support Intel macOS.
      - name: Build Emacs 30.1 with zlib
        shell: bash
        run: |
          curl --fail --location --retry 3 https://ftp.gnu.org/gnu/emacs/emacs-30.1.tar.xz -o "$RUNNER_TEMP/emacs.tar.xz"
          tar -xf "$RUNNER_TEMP/emacs.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/emacs-30.1"
          ./configure --prefix="$RUNNER_TEMP/emacs" --without-x --without-ns \
            --without-native-compilation --without-tree-sitter --without-dbus \
            --without-sound --without-pop --without-mailutils --without-compress-install
          make -j3
          make install
          "$RUNNER_TEMP/emacs/bin/emacs" -Q --batch \
            --eval '(unless (fboundp (quote zlib-decompress-region)) (error "CI Emacs needs zlib"))'
          echo "$RUNNER_TEMP/emacs/bin" >> "$GITHUB_PATH"
      - name: Build and test sources
        run: |
          make service
          make crypto-test test compile packaging-test
      - name: Package runtime closure
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          VERSION=v0.2.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then VERSION="$GITHUB_REF_NAME"; fi
          make package VERSION="$VERSION"
      - name: Test relocated release in restricted environment
        shell: bash
        run: |
          mkdir -p build/relocated
          tar -xzf dist/*.tar.gz -C build/relocated
          python3 scripts/package-service.py --audit build/relocated
          mkdir -p build/empty-home
          env -i HOME="$PWD/build/empty-home" PATH=/usr/bin:/bin \
            LISPM_AUTH_SERVICE="$PWD/build/relocated/lispm-auth-service" \
            "$(command -v python3)" common-lisp/test.py
          env -i HOME="$PWD/build/empty-home" PATH=/usr/bin:/bin \
            LISPM_AUTH_SERVICE="$PWD/build/relocated/lispm-auth-service" \
            LISPM_AUTH_RELEASE_ARCHIVE="$(find "$PWD/dist" -name '*.tar.gz' -print -quit)" \
            "$(command -v emacs)" -Q --batch -L . \
            --eval '(setq native-comp-enable-subr-trampolines nil)' \
            -l test/lispm-auth-test.el -l test/lispm-auth-install-test.el \
            -f ert-run-tests-batch-and-exit
          python3 -c 'import hashlib,pathlib; p=next(pathlib.Path("dist").glob("*.tar.gz")); pathlib.Path("dist/SHA256SUMS").write_text(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: service-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: service-*
      - name: Consolidate verified checksums
        run: |
          mkdir release
          cp artifacts/*/*.tar.gz release/
          python3 -c 'import pathlib; pathlib.Path("release/SHA256SUMS").write_text("".join(p.read_text() for p in sorted(pathlib.Path("artifacts").glob("*/SHA256SUMS"))))'
      - name: Create reviewable draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --draft \
            --title "Standalone service $GITHUB_REF_NAME" \
            --notes 'Review platform tests, bundled licenses, corresponding source, OS compatibility and SHA256SUMS before publication. Client checksum pins must be updated from these actual artifacts.'
