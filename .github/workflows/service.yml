name: Standalone Common Lisp service

on:
  push:
    branches: [main, feature/standalone-auth-service]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and release ancestry
        id: version
        shell: bash
        run: |
          VERSION=v0.0.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION="$GITHUB_REF_NAME"
            [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x86_64
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ecl libsodium pkgconf
          echo "SODIUM_PREFIX=$(brew --prefix libsodium)" >> "$GITHUB_ENV"
      - name: Install build dependencies and source indexes (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Mirror the runner's authenticated binary repositories, including
          # Ubuntu ports on ARM64, rather than assuming amd64 archive URLs.
          sudo python3 - <<'PY'
          from pathlib import Path
          sources = Path('/etc/apt/sources.list')
          if sources.exists():
              lines = sources.read_text().splitlines()
              sources.write_text('\n'.join(lines + [line.replace('deb ', 'deb-src ', 1) for line in lines if line.startswith('deb ')]) + '\n')
          for path in Path('/etc/apt/sources.list.d').glob('*.sources'):
              path.write_text(path.read_text().replace('Types: deb\n', 'Types: deb deb-src\n'))
          PY
          sudo apt-get update
          sudo apt-get install -y ecl libecl-dev libgc-dev libgmp-dev libffi-dev libsodium-dev patchelf pkg-config build-essential dpkg-dev
          mkdir -p build/sodium/lib build/sodium/include
          cp "/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/libsodium.a" build/sodium/lib/
          cp -R /usr/include/sodium /usr/include/sodium.h build/sodium/include/
          echo "SODIUM_PREFIX=$PWD/build/sodium" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-emacs
      - name: Build and test sources
        run: |
          make service
          make crypto-test test compile packaging-test
      - name: Package runtime closure
        run: make package VERSION="$VERSION" PLATFORM="$PLATFORM"
      - name: Test relocated release in restricted environment
        shell: bash
        run: |
          mkdir -p build/relocated build/empty-home
          tar -xzf "dist/lispm-auth-service-$VERSION-$PLATFORM.tar.gz" -C build/relocated
          python3 scripts/package-service.py --audit build/relocated --platform "$PLATFORM"
          env -i HOME="$PWD/build/empty-home" PATH=/usr/bin:/bin \
            LISPM_AUTH_SERVICE="$PWD/build/relocated/lispm-auth-service" \
            "$(command -v python3)" common-lisp/test.py
          env -i HOME="$PWD/build/empty-home" PATH=/usr/bin:/bin \
            LISPM_AUTH_SERVICE="$PWD/build/relocated/lispm-auth-service" \
            LISPM_AUTH_RELEASE_ARCHIVE="$PWD/dist/lispm-auth-service-$VERSION-$PLATFORM.tar.gz" \
            "$(command -v emacs)" -Q --batch -L . \
            --eval '(setq native-comp-enable-subr-trampolines nil)' \
            -l test/lispm-auth-test.el -l test/lispm-auth-install-test.el \
            -f ert-run-tests-batch-and-exit
      - name: Collect exact corresponding dependency sources
        run: |
          python3 scripts/collect-release-sources.py --runtime build/relocated \
            --platform "$PLATFORM" --output "dist/lispm-auth-$VERSION-$PLATFORM-dependency-sources.tar.gz"
          python3 -c 'import hashlib,pathlib; pathlib.Path("dist/SHA256SUMS").write_text("".join(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n" for p in sorted(pathlib.Path("dist").glob("*.tar.gz"))))'
      - uses: actions/upload-artifact@v4
        with:
          name: service-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  assemble:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: service-*
      - name: Generate pinned client and complete release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 scripts/assemble-release.py --inputs artifacts --output release \
            --version "$VERSION" --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release/*
          if-no-files-found: error

  verify-client:
    needs: [prepare, assemble]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x86_64
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-emacs
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: release
      - name: Verify actual generated client pins and native install
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          python3 scripts/verify-release.py release
          mkdir client
          tar -xzf "release/lispm-auth-client-${VERSION#v}.tar.gz" -C client --strip-components=1
          cd client
          mkdir -p build/empty-home
          env -i HOME="$PWD/build/empty-home" PATH=/usr/bin:/bin \
            LISPM_AUTH_RELEASE_ARCHIVE="$GITHUB_WORKSPACE/release/lispm-auth-service-$VERSION-$PLATFORM.tar.gz" \
            LISPM_AUTH_EXPECTED_VERSION="$VERSION" \
            LISPM_AUTH_EXPECTED_PLATFORM="$PLATFORM" \
            "$(command -v emacs)" -Q --batch -L . \
            --eval '(setq native-comp-enable-subr-trampolines nil)' \
            -l test/lispm-auth-release-test.el -f ert-run-tests-batch-and-exit

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, verify-client]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: release
      - name: Verify candidate again
        run: python3 scripts/verify-release.py release
      - name: Publish new immutable version automatically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # A failed lookup is not proof of absence: listing must succeed.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' > existing-tags
          if grep -Fxq "$GITHUB_REF_NAME" existing-tags; then
            echo "Refusing to overwrite an existing public or draft release" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag \
            --title "LispM Auth $GITHUB_REF_NAME" --notes-file release/RELEASE-NOTES.md
